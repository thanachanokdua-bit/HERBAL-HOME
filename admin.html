<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>หลังบ้าน | HERBAL HOME</title><link rel="stylesheet" href="style.css"><style>.admin{max-width:1100px;margin:45px auto;padding:0 20px}.admin h1{font:36px Georgia}.admin-actions{display:flex;gap:10px;flex-wrap:wrap;margin:20px 0}.admin button{padding:10px 16px;border:0;background:#727c5e;color:white;cursor:pointer}.order-card{background:#fffefa;border:1px solid #e9e3d8;padding:20px;margin:15px 0}.order-card h3{margin-top:0}.order-card p{font-size:13px;line-height:1.8}.order-card table{width:100%;border-collapse:collapse;font-size:13px}.order-card td,.order-card th{border-bottom:1px solid #eee;padding:8px;text-align:left}.print-label{border:1px dashed #777;padding:18px;max-width:420px;margin:15px 0}.muted{color:#8a8375;font-size:12px}@media print{.site-header,.admin-actions,.no-print{display:none!important}.admin{margin:0}.order-card{break-inside:avoid}}</style></head><body><header class="site-header"><a class="brand" href="index.html"><span class="brand-mark">H</span><span>HERBAL HOME<small>ORDER MANAGEMENT</small></span></a><a href="index.html">กลับหน้าร้าน</a></header><main class="admin"><p class="eyebrow">ORDER MANAGEMENT</p><h1>จัดการคำสั่งซื้อ</h1><p class="muted">หน้านี้แสดงออเดอร์ตัวอย่างที่บันทึกในเบราว์เซอร์เครื่องนี้ หรือออเดอร์จาก Google Sheets ที่นำเข้าเป็น JSON เพื่อสาธิตการหยิบและแพ็กสินค้า</p><div class="admin-actions"><button onclick="loadDemo()">โหลดออเดอร์ทดลอง</button><button onclick="loadFromSheets()">ดึงออเดอร์จาก Google Sheets</button><button onclick="document.getElementById('jsonFile').click()">นำเข้าไฟล์ JSON</button><input id="jsonFile" type="file" accept=".json" hidden><button onclick="window.print()">พิมพ์รายการ / ใบจัดส่ง</button></div><div id="orders"></div></main><script>
const GOOGLE_SCRIPT_URL = ""; // วาง Web app URL เดียวกับใน script.js\nlet orders=[];async function loadFromSheets(){if(!GOOGLE_SCRIPT_URL){alert("กรุณาใส่ Google Apps Script Web app URL ใน admin.html ก่อน");return}try{const res=await fetch(GOOGLE_SCRIPT_URL);orders=await res.json();render()}catch(e){alert("ดึงข้อมูลไม่สำเร็จ กรุณาตรวจสอบ URL และสิทธิ์การ Deploy")}}function loadDemo(){orders=JSON.parse(localStorage.getItem("herbalOrders")||"[]");render()}
document.getElementById("jsonFile").addEventListener("change",async e=>{const f=e.target.files[0];if(!f)return;try{const j=JSON.parse(await f.text());orders=Array.isArray(j)?j:[j];render()}catch{alert("ไฟล์ JSON ไม่ถูกต้อง")}});
function render(){const root=document.getElementById("orders");if(!orders.length){root.innerHTML="<p>ยังไม่มีคำสั่งซื้อในเครื่องนี้ กรุณาทดลองสั่งซื้อจากหน้าร้านก่อน</p>";return}root.innerHTML=orders.map((o,i)=>`<section class="order-card"><h3>คำสั่งซื้อ ${o.orderId||"ORDER-"+(i+1)}</h3><p><b>ผู้รับ:</b> ${o.customer||"-"}<br><b>โทร:</b> ${o.phone||"-"}<br><b>ที่อยู่:</b> ${o.address||"-"}</p><h4>Picking List / รายการหยิบสินค้า</h4><table><tr><th>SKU</th><th>สินค้า</th><th>จำนวน</th><th>ตรวจแล้ว</th></tr>${(o.items||[]).map(x=>`<tr><td>${x.sku}</td><td>${x.name}</td><td>${x.qty}</td><td>☐</td></tr>`).join("")}</table><p><b>ยอดรวม:</b> ฿${Number(o.total||0).toLocaleString("th-TH")}</p><div class="print-label"><h3>HERBAL HOME — SHIPPING LABEL</h3><p><b>ผู้รับ:</b> ${o.customer||"-"}</p><p><b>โทร:</b> ${o.phone||"-"}</p><p><b>ที่อยู่จัดส่ง:</b><br>${o.address||"-"}</p><p><b>เลขที่คำสั่งซื้อ:</b> ${o.orderId||"-"}</p></div></section>`).join("")}
loadDemo();</script></body></html>
